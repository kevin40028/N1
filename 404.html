<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Página não encontrada — N1 Fardamentos</title>
  <link rel="icon" type="image/png" href="favicon-n1-oficial.png?v=2">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
      padding: 24px;
    }

    .box {
      max-width: 600px;
      background: #fff;
      padding: 50px 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      font-size: 72px;
      margin: 0 0 10px;
      font-weight: 800;
    }

    h2 {
      margin: 0 0 15px;
      font-size: 28px;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
      color: #666;
      margin-bottom: 28px;
    }

    a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    a:hover {
      opacity: .85;
    }
  </style>
</head>
<body>
  <main class="box">
    <h1>404</h1>
    <h2>Página não encontrada</h2>
    <p>
      A página que você procura não existe ou foi movida.
      Volte para a página inicial da N1 Fardamentos.
    </p>
    <a href="./">Voltar para o início</a>
  </main>
</body>
</html>
